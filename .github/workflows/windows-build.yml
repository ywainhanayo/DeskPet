name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'win-*'

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.2.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pyobjc 仅 macOS,此处自动跳过)
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1 numpy==2.4.6 Pillow==12.3.0 pyinstaller==6.22.3

      - name: Build with PyInstaller
        run: |
          cd packaging
          pyinstaller .\DeskPet-windows.spec --noconfirm

      - name: Smoke test (launch for 6 seconds)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\packaging\dist\DeskPet\DeskPet.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            Write-Error "DeskPet.exe 在冒烟测试期间退出(启动即崩)"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Write-Output "冒烟通过:进程存活 6 秒"

      - name: Zip dist
        shell: pwsh
        run: Compress-Archive -Path ".\packaging\dist\DeskPet\*" -DestinationPath "DeskPet-$env:VERSION-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-${{ github.run_number }}-windows
          path: DeskPet-*-windows.zip
          if-no-files-found: error
